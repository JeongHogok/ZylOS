name: Build & Test
on: [push, pull_request]
jobs:
  # ─── Native C build (Arch Linux) ───
  build-native:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel meson ninja pkgconf git \
            wayland wayland-protocols \
            libxkbcommon pixman libinput \
            libdrm mesa libglvnd \
            gtk4 webkitgtk-6.0 json-glib \
            hwdata libdisplay-info \
            seatd \
            openssl libzip curl gpsd \
            python nodejs dbus
      - name: Build wlroots from source
        run: |
          git clone --depth 1 --branch 0.18.2 https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
          cd /tmp/wlroots
          meson setup build --prefix=/usr -Dexamples=false -Dxwayland=disabled -Dwerror=false
          ninja -C build
          ninja -C build install
          ldconfig
      - name: Build Zyl OS
        run: |
          meson setup builddir
          ninja -C builddir
      # The profile matrix must stay configurable: a service set referring to a
      # directory that no longer exists, or a board/profile pair that stopped
      # agreeing, fails here instead of on someone's device build.
      - name: Check every form-factor profile configures
        run: |
          for p in phone tablet tv auto watch desktop appliance pda; do
            meson setup "builddir-$p" -Dboard=emulator -Dprofile="$p" >/dev/null \
              || { echo "profile $p failed to configure"; exit 1; }
            echo "ok: $p"
            rm -rf "builddir-$p"
          done
      - name: Run C unit tests
        run: ninja -C builddir test
      - name: Check app manifests
        run: |
          for f in apps/*/app.json; do
            python3 -c "import json; json.load(open('$f'))" || exit 1
          done
          echo "All manifests valid"

  # ─── HTML lint ───
  lint-html:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML DOCTYPE first line
        run: bash tests/test_doctype.sh

  # ─── JavaScript syntax check ───
  lint-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          find apps/ -name '*.js' | while read f; do
            node --check "$f" || exit 1
          done
          echo "All JS files parse OK"

  # ─── JavaScript unit tests ───
  test-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run service module tests
        run: node tests/test_services.js

  # ─── App performance budgets ───
  # Startup time, main-thread blocking, heap, DOM and layout counts per app,
  # on a throttled CPU without GPU. Fails when an app goes over budget.
  perf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: App performance budgets
        run: node tests/perf/run.js --runs=3

  # ─── License audit ───
  audit-licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit third-party licenses
        run: bash tests/audit_licenses.sh

  # ─── Fuzz testing (short CI run) ───
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libglib2.0-dev libjson-glib-dev pkg-config
      # fuzz_json_dispatch.c compiles the real bridge.c, so it needs GLib,
      # GIO and JSON-GLib plus the mock WebKit shim. The build line that
      # harness documents in its own header comment is what we use here.
      - name: Build and run fuzzers
        run: |
          cd tests/fuzz
          PKG_FLAGS=$(pkg-config --cflags --libs glib-2.0 gio-2.0 json-glib-1.0)
          for f in fuzz_*.c; do
            name="${f%.c}"
            clang -g -O1 -fsanitize=fuzzer,address \
              -DZYL_USE_WEBKIT2GTK \
              -I../include -I. \
              "$f" $PKG_FLAGS -o "$name"
            mkdir -p "corpus/$name"
            "./$name" "corpus/$name" -max_len=4096 -runs=10000 || exit 1
          done
          echo "All fuzz runs passed"

  # ─── Image build + emulated boot (no hardware needed) ───
  # The same distro builds the binaries and the image: a compositor linked
  # against the runner's wlroots would not find it inside the guest.
  qemu-boot:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build, image and QEMU tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config python3 \
            libglib2.0-dev libjson-glib-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libssl-dev libcurl4-openssl-dev libzip-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libpixman-1-dev \
            libinput-dev libdrm-dev libegl-dev libgles-dev libdisplay-info-dev \
            libseat-dev libgps-dev hwdata libwlroots-0.18-dev \
            debootstrap systemd systemd-sysv fdisk e2fsprogs dbus ca-certificates \
            qemu-system-x86 linux-image-amd64
      - name: Build (board=emulator, profile=phone)
        run: |
          meson setup builddir --prefix=/usr -Dboard=emulator -Dprofile=phone
          ninja -C builddir
      - name: Every form factor still assembles
        run: bash tests/test_image_profiles.sh
      - name: Build the disk image
        # --with-kernel: QEMU 게스트에는 모듈이 있어야 DRM·입력이 보인다.
        # 실기기 이미지는 커널을 서명 FIT 으로 받으므로 기본은 끔
        run: bash tools/build-image.sh --builddir builddir --out out/image --with-kernel
      - name: Boot it in QEMU and run the self test
        run: bash tools/run-qemu.sh --image out/image/zyl-os-emulator-phone.img --builddir builddir --check --timeout 600

  # ─── riscv64: same architecture and HAL backend as the device, no board ───
  # The emulator board builds for the host arch with the HAL emulator backend,
  # so it cannot see what breaks on riscv64. This lane cross-builds, assembles
  # a riscv64 rootfs (2-stage debootstrap through binfmt) and boots it.
  qemu-boot-riscv64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:trixie
      # privileged: binfmt_misc 등록이 필요하다 — 2단계 부트스트랩이 riscv64
      # 바이너리를 호스트에서 실행한다
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain, riscv64 libraries, image and QEMU tools
        run: |
          dpkg --add-architecture riscv64
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            meson ninja-build pkgconf python3 binutils \
            crossbuild-essential-riscv64 libglib2.0-dev-bin wayland-protocols hwdata \
            libglib2.0-dev:riscv64 libjson-glib-dev:riscv64 libgtk-4-dev:riscv64 \
            libwebkitgtk-6.0-dev:riscv64 libssl-dev:riscv64 libcurl4-openssl-dev:riscv64 \
            libzip-dev:riscv64 libwayland-dev:riscv64 libxkbcommon-dev:riscv64 \
            libpixman-1-dev:riscv64 libinput-dev:riscv64 libdrm-dev:riscv64 \
            libegl-dev:riscv64 libgles-dev:riscv64 libdisplay-info-dev:riscv64 \
            libseat-dev:riscv64 libgps-dev:riscv64 libwlroots-0.18-dev:riscv64 \
            debootstrap systemd systemd-sysv fdisk e2fsprogs dbus ca-certificates \
            qemu-user-static qemu-system-misc
      - name: Register the riscv64 binfmt handler
        run: |
          mountpoint -q /proc/sys/fs/binfmt_misc \
            || mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc || true
          # 데비안은 binfmt 등록을 systemd 로 옮겼다 — 컨테이너에는 systemd 가
          # 돌지 않으니 그 도구를 직접 불러 /usr/lib/binfmt.d/*.conf 를 읽힌다
          /usr/lib/systemd/systemd-binfmt || true
          # 조건은 등록 흔적이 아니라 실행 여부다 — 호스트 커널에 이미 등록된
          # 핸들러(F 플래그)로 돌아가는 환경에서는 컨테이너에 흔적이 없다
          echo 'int main(void){return 0;}' > /tmp/rv-probe.c
          riscv64-linux-gnu-gcc -static /tmp/rv-probe.c -o /tmp/rv-probe
          /tmp/rv-probe \
            || { echo "✗ riscv64 바이너리를 실행할 수 없다 — 2단계 부트스트랩이 불가능하다"; exit 1; }
      - name: Cross-build (board=generic-riscv64, profile=phone)
        run: |
          meson setup builddir-rv64 --prefix=/usr \
            --cross-file tools/cross/riscv64.ini \
            -Dboard=generic-riscv64 -Dprofile=phone
          ninja -C builddir-rv64
      - name: Build the riscv64 disk image
        run: bash tools/build-image.sh --builddir builddir-rv64 --out out/rv64 --with-kernel
      - name: Boot it in QEMU and run the self test
        run: |
          bash tools/run-qemu.sh --image out/rv64/zyl-os-generic-riscv64-phone.img \
            --builddir builddir-rv64 --check --timeout 1800

  # ─── Integration tests ───
  test-integration:
    runs-on: ubuntu-24.04
    needs: build-native
    steps:
      - uses: actions/checkout@v4
      - name: Install boot image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cryptsetup-bin u-boot-tools device-tree-compiler
      - name: Run integration tests
        run: |
          bash tests/test_manifests.sh
          bash tests/test_js_syntax.sh
          # Boot policy (A/B tries, bootloader lock) executed from u-boot-env.txt
          bash tests/test_boot_env.sh
          # Slot-signed boot images; Ubuntu's u-boot-tools lack fit_check_sign,
          # so signature verification itself runs where that tool exists
          bash tests/test_sign_image.sh
          # OTA package: both slots' verity trees and FITs, signed for the updater
          bash tests/test_build_ota.sh
          echo "Integration tests passed"

  # ─── Docker reproducible build ───
  build-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker
        run: docker build --target builder -t zylos-build .
