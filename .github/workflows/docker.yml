# ──────────────────────────────────────────────────────────
# [Clean Architecture] Infrastructure Layer - CI
#
# 역할: 재현 가능한 빌드 환경(Dockerfile)이 여전히 서는지
# 수행범위: docker build --target builder
# 의존방향: Docker, Arch 미러
# SOLID: SRP — 이 관심사만. 어떤 경로가 이 검사를 부르는지는 아래 paths 가
#        유일한 출처다 (원격 PR 과 tools/ci-local.sh 가 같은 목록을 읽는다)
# ──────────────────────────────────────────────────────────
name: Docker
# PR 은 paths 에 걸린 변경이 있을 때만, main 은 머지마다 전부 돈다
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'meson.build'
      - 'meson_options.txt'
      - '.github/workflows/docker.yml'
# 같은 PR 에 새 커밋이 오면 이전 커밋의 런은 취소한다. main 은 끝까지 검증한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # ─── Docker reproducible build ───
  build-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker
        run: docker build --target builder -t zylos-build .
