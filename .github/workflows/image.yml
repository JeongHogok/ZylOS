# ──────────────────────────────────────────────────────────
# [Clean Architecture] Infrastructure Layer - CI
#
# 역할: 이미지 조립 + QEMU 부팅 + 자기점검 (호스트 아키텍처, 에뮬레이터 보드)
# 수행범위: 폼팩터 8종 조립, 디스크 이미지, 부팅 후 zyl-selftest
# 의존방향: debian:trixie, debootstrap, QEMU
# SOLID: SRP — 이 관심사만. 어떤 경로가 이 검사를 부르는지는 아래 paths 가
#        유일한 출처다 (원격 PR 과 tools/ci-local.sh 가 같은 목록을 읽는다)
# ──────────────────────────────────────────────────────────
name: Image
# PR 은 paths 에 걸린 변경이 있을 때만, main 은 머지마다 전부 돈다
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'runtime/**'
      - 'compositor/**'
      - 'apps/**'
      - 'system/**'
      - 'board/emulator/**'
      - 'board/meson.build'
      - 'meson.build'
      - 'meson_options.txt'
      - 'tools/build-image.sh'
      - 'tools/run-qemu.sh'
      - 'tools/zyl-selftest'
      - 'tests/test_image_profiles.sh'
      - '.github/workflows/image.yml'
# 같은 PR 에 새 커밋이 오면 이전 커밋의 런은 취소한다. main 은 끝까지 검증한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # ─── Image build + emulated boot (no hardware needed) ───
  # The same distro builds the binaries and the image: a compositor linked
  # against the runner's wlroots would not find it inside the guest.
  # The emulator board builds for the host arch, so both QEMUs are installed:
  # GitHub runs it on amd64, tools/ci-local.sh natively on an ARM Mac. The
  # guest boots the image's own kernel (--with-kernel), never the host's.
  qemu-boot:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build, image and QEMU tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config python3 \
            libglib2.0-dev libjson-glib-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libssl-dev libcurl4-openssl-dev libzip-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libpixman-1-dev \
            libinput-dev libdrm-dev libegl-dev libgles-dev libdisplay-info-dev \
            libseat-dev libgps-dev hwdata libwlroots-0.18-dev \
            debootstrap systemd systemd-sysv fdisk e2fsprogs dbus ca-certificates \
            qemu-system-x86 qemu-system-arm
      - name: Build (board=emulator, profile=phone)
        run: |
          meson setup builddir --prefix=/usr -Dboard=emulator -Dprofile=phone
          ninja -C builddir
      - name: Every form factor still assembles
        run: bash tests/test_image_profiles.sh
      - name: Build the disk image
        # --with-kernel: QEMU 게스트에는 모듈이 있어야 DRM·입력이 보인다.
        # 실기기 이미지는 커널을 서명 FIT 으로 받으므로 기본은 끔
        run: bash tools/build-image.sh --builddir builddir --out out/image --with-kernel
      - name: Boot it in QEMU and run the self test
        run: bash tools/run-qemu.sh --image out/image/zyl-os-emulator-phone.img --builddir builddir --check --timeout 600
