# ──────────────────────────────────────────────────────────
# [Clean Architecture] Infrastructure Layer - Toolchain Descriptor
#
# 역할: riscv64 교차 빌드 도구·경로 선언 (meson cross file)
# 수행범위: 컴파일러·pkg-config 경로·호스트 머신 기술. 보드 사실은 없음
# 의존방향: 없음 (순수 선언). board_cross_file 이 이 파일을 가리킨다
# SOLID: SRP — 툴체인 사실만. 어떤 보드가 쓰는지는 보드가 선언한다
# ──────────────────────────────────────────────────────────
#
# 사용: meson setup builddir --cross-file tools/cross/riscv64.ini -Dboard=bpi-f3
# 필요: crossbuild-essential-riscv64 + :riscv64 개발 라이브러리 (multiarch)

[binaries]
c = 'riscv64-linux-gnu-gcc'
cpp = 'riscv64-linux-gnu-g++'
ar = 'riscv64-linux-gnu-ar'
strip = 'riscv64-linux-gnu-strip'
pkg-config = 'pkg-config'

[properties]
# multiarch 교차 빌드: pkg-config 는 호스트 .pc 를 먼저 보므로 명시해야 한다.
# 안 하면 호스트 아키텍처의 -L 경로가 섞여 링크가 조용히 깨진다
pkg_config_libdir = ['/usr/lib/riscv64-linux-gnu/pkgconfig',
                     '/usr/share/pkgconfig']
# -mcpu=spacemit-k1 은 쓰지 않는다 — gcc 14 가 모르는 CPU 라 컴파일이 실패한다.
# SoC 별 튜닝은 툴체인이 그 이름을 알게 된 뒤에 보드별로 더할 자리다
c_args = ['-march=rv64gc', '-mabi=lp64d']
c_link_args = ['-march=rv64gc', '-mabi=lp64d']

[host_machine]
system = 'linux'
cpu_family = 'riscv64'
cpu = 'riscv64'
endian = 'little'

[built-in options]
c_std = 'gnu11'
