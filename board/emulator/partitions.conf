# ──────────────────────────────────────────────────────────
# [Clean Architecture] Infrastructure Layer - Board Descriptor
#
# 역할: 디스크 파티션 레이아웃 단일 출처 (에뮬레이터/VM 이미지)
# 수행범위: 디스크 노드·파티션 번호·크기만 선언. 빌드 로직 없음
# 의존방향: 없음 (순수 선언). 읽는 쪽: tools/build-image.sh, tools/run-qemu.sh
# SOLID: SRP — 레이아웃만 선언
#
# 실기기(board/bpi-f3)와 **같은 표**를 쓴다: 이미지 조립 코드가 보드마다
# 갈라지지 않게 하려는 것이다. 다른 점은 디스크 노드(virtio)와 크기뿐이고,
# A/B·verity 파티션은 만들어 두되 지금은 비워 둔다.
# ──────────────────────────────────────────────────────────

# QEMU virtio 디스크 — /dev/vda2 처럼 번호만 붙는다 (p 를 끼우지 않는다)
ZYL_DISK_NODE=/dev/vda
ZYL_PART_SEP=

ZYL_PART_BOOT=1
ZYL_PART_ROOT_A=2
ZYL_PART_VERITY_A=3
ZYL_PART_ROOT_B=4
ZYL_PART_VERITY_B=5
ZYL_PART_DATA=6

# CI 에서 매 커밋 만드는 이미지라 작게
ZYL_SIZE_BOOT_MIB=32
ZYL_SIZE_ROOT_MIB=3072
ZYL_SIZE_VERITY_MIB=32
ZYL_SIZE_DATA_MIB=256

# VM 은 부트로더를 디스크 앞에 심지 않는다 (QEMU 가 커널을 직접 띄운다)
ZYL_RESERVED_HEAD_MIB=1
