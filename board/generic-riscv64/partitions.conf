# ──────────────────────────────────────────────────────────
# [Clean Architecture] Infrastructure Layer - Board Descriptor
#
# 역할: 디스크 레이아웃·부트 환경의 자리·커널 콘솔 단일 출처 (일반 riscv64 / QEMU virt)
# 수행범위: 디스크 노드·파티션 번호·크기, U-Boot 환경의 자리, 콘솔만 선언. 빌드 로직 없음
# 의존방향: 없음 (순수 선언). 읽는 쪽: tools/build-image.sh, tools/run-qemu.sh,
#           tools/sign-image.sh, tools/build-bootloader.sh, tests/verified_boot.sh,
#           runtime/hal/meson.build (Boot HAL 의 슬롯), tests/test_boot_env.sh (대조)
# SOLID: SRP — 레이아웃만 선언
#
# 실기기(board/bpi-f3)와 **같은 표**를 쓴다: 이미지 조립·서명·A/B 코드가 보드마다
# 갈라지지 않게 하려는 것이다. 다른 점은 디스크 노드(virtio), 크기, 환경의 자리뿐이다.
# 검증 부팅 레인(tests/verified_boot.sh)이 슬롯 A·B 와 verity 파티션을 채워 부팅한다.
# ──────────────────────────────────────────────────────────

# QEMU virtio 디스크 — /dev/vda2 처럼 번호만 붙는다 (p 를 끼우지 않는다)
ZYL_DISK_NODE=/dev/vda
ZYL_PART_SEP=

# 커널 콘솔 — 서명된 커널 인자에 들어간다 (tools/sign-image.sh)
ZYL_CONSOLE=ttyS0,115200

ZYL_PART_BOOT=1
ZYL_PART_ROOT_A=2
ZYL_PART_VERITY_A=3
ZYL_PART_ROOT_B=4
ZYL_PART_VERITY_B=5
ZYL_PART_DATA=6

# CI 에서 매 커밋 만드는 이미지라 작게
# 부트 파티션에는 두 슬롯의 서명 FIT(커널+initramfs, 각 수십 MiB)와 U-Boot 환경이 산다
ZYL_SIZE_BOOT_MIB=192
ZYL_SIZE_ROOT_MIB=3072
ZYL_SIZE_VERITY_MIB=32
ZYL_SIZE_DATA_MIB=256

# 부트로더(OpenSBI·U-Boot)는 디스크가 아니라 QEMU 가 펌웨어로 싣는다
ZYL_RESERVED_HEAD_MIB=1

# U-Boot 환경의 자리 (형식은 board/bpi-f3/partitions.conf). QEMU 의 virtio 디스크에는
# 예약 영역에 환경을 둘 U-Boot 드라이버가 없어 부트 파티션의 파일로 둔다
ZYL_ENV_IN=fat
ZYL_ENV_FILE=uboot.env
ZYL_ENV_SIZE=0x20000
