# ──────────────────────────────────────────────────────────
# [Clean Architecture] Infrastructure Layer - Board Descriptor
#
# 역할: 디스크 파티션 레이아웃 단일 출처 (BPI-F3 eMMC/SD)
# 수행범위: 디스크 노드·파티션 번호·크기만 선언. 빌드 로직 없음
# 의존방향: 없음 (순수 선언). 읽는 쪽:
#           tools/build-image.sh      이미지를 이 표대로 조립
#           tools/sign-image.sh       슬롯의 rootfs·verity 파티션을 커널 인자에
#           runtime/hal/meson.build   Boot HAL 의 슬롯 파티션 (OTA 가 쓰는 곳)
#           board/bpi-f3/u-boot-env.txt  zyl_boot_part·zyl_data
#           tests/test_boot_env.sh    위 둘이 어긋나면 실패
# SOLID: SRP — 레이아웃만 선언, DIP — 도구가 숫자를 들고 있지 않고 여기를 읽는다
#
# 셸에서 source 할 수 있는 형식(key=value)으로만 쓸 것 — 파서가 둘 있다.
# ──────────────────────────────────────────────────────────

# 커널이 보는 디스크 (SD 카드도 eMMC 와 같은 노드 번호를 쓰는 설치가 기본)
ZYL_DISK_NODE=/dev/mmcblk0
# 파티션 장치 이름을 만드는 방식: 이름이 숫자로 끝나는 장치는 p 를 끼운다
# (/dev/mmcblk0p2), 그렇지 않으면 번호만 붙인다 (/dev/sda2)
ZYL_PART_SEP=p

# 파티션 번호
ZYL_PART_BOOT=1
ZYL_PART_ROOT_A=2
ZYL_PART_VERITY_A=3
ZYL_PART_ROOT_B=4
ZYL_PART_VERITY_B=5
ZYL_PART_DATA=6

# 크기 (MiB). ZYL_SIZE_DATA_MIB=0 은 "남은 공간 전부"
# (verity 는 rootfs 의 1/128 이면 충분하지만, OTA 가 더 큰 rootfs 를 받을 여유를 둔다)
ZYL_SIZE_BOOT_MIB=256
ZYL_SIZE_ROOT_MIB=4096
ZYL_SIZE_VERITY_MIB=256
ZYL_SIZE_DATA_MIB=0

# 첫 파티션 앞에 비워 두는 영역: FSBL·OpenSBI·U-Boot·env 가 들어간다
# (tools/build-bootloader.sh 의 출력)
ZYL_RESERVED_HEAD_MIB=4

# U-Boot 환경의 자리 — 부트로더(CONFIG_ENV_OFFSET·CONFIG_ENV_SIZE, tools/build-bootloader.sh
# 가 대조)와 OS 의 fw_env.config(tools/build-image.sh 가 생성, Boot HAL·업데이터가 쓴다)가
# 같은 곳을 본다. raw = 디스크 처음부터 ZYL_ENV_OFFSET 바이트, fat = 부트 파티션의
# ZYL_ENV_FILE, none = 부트로더가 없는 보드
ZYL_ENV_IN=raw
ZYL_ENV_OFFSET=0x60000
ZYL_ENV_SIZE=0x4000
