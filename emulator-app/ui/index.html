<!DOCTYPE html>
<!-- [Clean Architecture] Presentation Layer - Page
     역할: Zyl OS 네이티브 에뮬레이터 SPA 엔트리포인트
     클린아키텍처, SOLID원칙, i18n 규칙 철저 준수
     에뮬레이터는 실제 디바이스 구동 환경 제공이 목적이며, OS 이미지 영역의 콘텐츠를 포함하지 않는다 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyl OS Emulator</title>
  <link rel="stylesheet" href="css/config.css">
  <link rel="stylesheet" href="css/boot.css">
  <link rel="stylesheet" href="css/emulator.css">
</head>
<body>
  <!-- ═══ Phase 1: 설정 화면 ═══ -->
  <div id="config-screen" role="main">
    <div class="config-header">
      <h1 class="config-title">Zyl OS Emulator</h1>
      <p class="config-subtitle">Configure and boot a virtual device</p>
    </div>

    <!-- Saved Devices 목록 -->
    <div id="saved-devices-section" class="config-section hidden">
      <h2 class="section-title">Saved Devices</h2>
      <div id="saved-devices-list" class="device-cards"></div>
    </div>

    <!-- Step 1: 디바이스 프로필 선택 -->
    <div id="config-step-1" class="config-step">
      <h2 class="section-title">Create New Device</h2>
      <div id="profile-cards" class="device-cards"></div>
    </div>

    <!-- Step 2: Resource Settings -->
    <div id="config-step-2" class="config-step hidden">
      <h2 class="section-title">Resource Settings</h2>
      <div class="config-form">
        <div class="form-group">
          <label>OS Image</label>
          <div id="os-version-options"></div>
        </div>
        <div class="form-group">
          <label>Storage</label>
          <div id="storage-options" class="option-row"></div>
        </div>
        <div class="form-group">
          <label>RAM</label>
          <div id="ram-options" class="option-row"></div>
        </div>
        <div class="host-info" id="host-info"></div>
      </div>
      <div class="step-actions">
        <button id="btn-back-step1" class="btn btn-secondary" aria-label="Back to step 1">Back</button>
        <button id="btn-next-step3" class="btn btn-primary" aria-label="Next step">Next</button>
      </div>
    </div>

    <!-- Step 3: 확인 -->
    <div id="config-step-3" class="config-step hidden">
      <h2 class="section-title">Confirm Settings</h2>
      <div id="config-summary" class="summary-card"></div>
      <div class="step-actions">
        <button id="btn-back-step2" class="btn btn-secondary">Back</button>
        <button id="btn-boot" class="btn btn-boot">Boot</button>
      </div>
    </div>
  </div>

  <!-- ═══ Phase 2: 부팅 스플래시 ═══ -->
  <div id="boot-screen" class="hidden">
    <div class="boot-container">
      <div class="boot-logo">
        <div class="boot-logo-text">Zyl OS</div>
        <div class="boot-version" id="boot-version"></div>
      </div>
      <div class="boot-progress">
        <div class="boot-progress-bar" id="boot-progress-bar"></div>
      </div>
      <div class="boot-log" id="boot-log"></div>
    </div>
  </div>

  <!-- ═══ Phase 3: 디바이스 에뮬레이터 (기존 emulator 구조) ═══ -->
  <div id="emulator-screen" class="hidden">
    <div id="backdrop"></div>

    <div id="device-frame">
      <button id="side-power" class="side-btn side-btn-right side-power" title="Power (P)" aria-label="Power"></button>
      <button id="side-volup" class="side-btn side-btn-right side-volup" title="Vol+ (↑)">+</button>
      <button id="side-voldown" class="side-btn side-btn-right side-voldown" title="Vol- (↓)" aria-label="Volume down"></button>

      <div id="device-notch"></div>
      <div id="device-screen">
        <!-- The OS's system UI (status bar, notification panel, recents) -->
        <iframe id="system-frame" src="" frameborder="0"
          sandbox="allow-scripts allow-same-origin"
          allow="camera 'none'; microphone 'none'; geolocation 'none'"></iframe>

        <div id="app-viewport">
          <!-- OS-owned web content view (webcontent service): a separate frame
               the OS drives, with no bridge — mirrors the device's bridge-less
               WebKitWebView. An app embedding web content never touches it. -->
          <iframe id="content-frame" src="" frameborder="0"
            sandbox="allow-scripts allow-forms allow-popups allow-presentation"
            allow="camera 'none'; microphone 'none'; geolocation 'none'"></iframe>
          <iframe id="app-frame" src="" frameborder="0"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
            allow="camera 'none'; microphone 'none'; geolocation 'none'"></iframe>
        </div>

        <!-- Volume OSD -->
        <div id="volume-osd">
          <div id="volume-osd-icon">🔊</div>
          <div id="volume-osd-track"><div id="volume-osd-bar"></div></div>
          <div id="volume-osd-value">70</div>
        </div>


        <div id="nav-softkeys" class="nav-bar hidden" role="navigation" aria-label="Navigation">
          <button class="nav-sk-btn" id="sk-back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
          <button class="nav-sk-btn nav-sk-home" id="sk-home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="white" stroke-width="2"/></svg></button>
          <button class="nav-sk-btn" id="sk-recents" aria-label="Recent apps"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" fill="none" stroke="white" stroke-width="2"/></svg></button>
        </div>

        <div id="nav-gesture" class="nav-bar hidden">
          <div id="gesture-bar"></div>
        </div>
      </div>

      <div id="nav-hardware" class="hidden" role="navigation" aria-label="Hardware navigation">
        <button class="hw-btn" id="hw-back" aria-label="Back">&#9665;</button>
        <button class="hw-btn hw-home" id="hw-home" aria-label="Home">&#9711;</button>
        <button class="hw-btn" id="hw-recents" aria-label="Recent apps">&#9633;</button>
      </div>
    </div>

    <div id="control-panel" role="complementary" aria-label="Emulator controls">
      <div id="device-info-header"></div>
      <div class="control-group">
        <label>Actions</label>
        <div class="btn-row">
          <button id="btn-power" class="ctrl-btn" title="Power">Power</button>
          <button id="btn-volup" class="ctrl-btn" title="Vol+">Vol+</button>
          <button id="btn-voldown" class="ctrl-btn" title="Vol-">Vol-</button>
          <button id="btn-reboot" class="ctrl-btn ctrl-wide" title="Reboot">Reboot</button>
        </div>
      </div>
      <div class="control-group">
        <label>Resources</label>
        <div id="resource-info"></div>
      </div>
      <div class="control-group">
        <label>Running Apps</label>
        <div id="running-apps-list"></div>
      </div>
      <div class="control-group">
        <label>System Log</label>
        <div id="sys-log"></div>
      </div>
    </div>
  </div>

  <script src="js/emu-i18n.js"></script>
  <!-- OS System Framework (loaded from OS image) -->
  <!-- OS form-factor policy, used by the app registry to filter apps per
       profile. responsive.css is deliberately NOT loaded: it would scale the
       emulator chrome. The on-screen keyboard is OS UI inside each app page
       (apps/keyboard/js/inpage.js), not hosted here. -->
  <script src="apps/shared/form-factor.js"></script>
  <script src="apps/system/sandbox.js"></script>
  <script src="apps/system/security.js"></script>
  <script src="apps/system/permissions.js"></script>
  <script src="apps/system/app-registry.js"></script>
  <script src="apps/system/intent.js"></script>
  <script src="apps/system/shell.js"></script>
  <script src="apps/system/consent.js"></script>
  <!-- Service Modules (loaded before router) -->
  <script src="apps/system/release.js"></script>
  <script src="apps/system/services/fs.js"></script>
  <script src="apps/system/services/device.js"></script>
  <script src="apps/system/services/storage.js"></script>
  <script src="apps/system/services/app-seal.js"></script>
  <script src="apps/system/services/apps.js"></script>
  <script src="apps/system/services/settings.js"></script>
  <script src="apps/system/services/wifi.js"></script>
  <script src="apps/system/services/clipboard.js"></script>
  <script src="apps/system/services/bluetooth.js"></script>
  <script src="apps/system/services/network.js"></script>
  <script src="apps/system/services/appdata.js"></script>
  <script src="apps/system/services/notification.js"></script>
  <script src="apps/system/services/power.js"></script>
  <script src="apps/system/services/display.js"></script>
  <script src="apps/system/services/input.js"></script>
  <script src="apps/system/services/sensors.js"></script>
  <script src="apps/system/services/location.js"></script>
  <script src="apps/system/services/telephony.js"></script>
  <script src="apps/system/services/contacts.js"></script>
  <script src="apps/system/services/messaging.js"></script>
  <script src="apps/system/services/usb.js"></script>
  <script src="apps/system/services/user.js"></script>
  <script src="apps/system/services/credential.js"></script>
  <script src="apps/system/services/appstore.js"></script>
  <script src="apps/system/services/updater.js"></script>
  <script src="apps/system/services/sandbox.js"></script>
  <script src="apps/system/services/logger.js"></script>
  <script src="apps/system/services/accessibility.js"></script>
  <script src="apps/system/services/alarm.js"></script>
  <script src="apps/system/services/push.js"></script>
  <script src="apps/system/services/telemetry.js"></script>
  <script src="apps/system/services/netstats.js"></script>
  <script src="apps/system/services/bootctl.js"></script>
  <script src="apps/system/services/lock.js"></script>
  <script src="apps/system/services/audio.js"></script>
  <!-- Service Router (assembles modules) -->
  <script src="apps/system/services.js"></script>
  <script src="apps/shared/touch-scroll.js"></script>
  <!-- Emulator IPC Router -->
  <script src="js/services.js"></script>
  <script src="js/config-ui.js"></script>
  <script src="js/boot-sequence.js"></script>
  <script src="js/app-state.js"></script>
  <script src="js/emulator.js"></script>
</body>
</html>
