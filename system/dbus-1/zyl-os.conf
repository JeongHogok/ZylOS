<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- ==========================================================
     [Clean Architecture] Infrastructure Layer : IPC Policy

     역할: Zyl OS 서비스 버스 정책 — org.zylos.* 이름의 소유·호출 권한
     수행범위: 시스템 버스에서 누가 Zyl 서비스 이름을 가질 수 있고 누가 부를 수
               있는지. 기본은 거부, 서비스 데몬과 WAM 만 허용
     의존방향: system/*.service 의 User= 와 BusName= 에 대응
               (유닛이 Type=dbus + BusName= 이므로 버스는 시스템 버스다)
     SOLID: SRP — 버스 접근 정책만 담당
            OCP — 서비스를 추가해도 이름이 org.zylos.* 면 이 파일은 그대로
     (XML 주석이라 헤더 구분선에 하이픈을 쓸 수 없다)

     앱은 이 버스에 직접 닿지 않는다. 앱의 서비스 호출은 WAM 이 받아
     권한을 판정한 뒤 대신 보낸다 (runtime/wam/src/bridge/bridge.c)
     ========================================================== -->
<busconfig>

  <!-- 서비스 데몬: system/*.service 가 root 로 띄운다.
       서비스마다 전용 사용자로 쪼개면 own 을 그 사용자 이름으로 좁힐 수 있다 -->
  <policy user="root">
    <allow own_prefix="org.zylos"/>
    <allow send_destination_prefix="org.zylos"/>
  </policy>

  <!-- WAM: 전용 사용자로 돌며 앱의 호출을 중계한다.
       자기 이름만 갖고, 모든 Zyl 서비스를 부른다 -->
  <policy user="zyl-wam">
    <allow own="org.zylos.WebAppManager"/>
    <allow send_destination_prefix="org.zylos"/>
  </policy>

  <!-- 외부 입력을 해석하는 서비스: 전용 사용자(system/sysusers.d/zyl-services.conf).
       자기 이름만 갖고, 일에 필요한 서비스만 부른다 — 하나가 뚫려도 다른 서비스의
       이름을 가로채거나 아무 서비스나 부르지 못한다 -->
  <policy user="zyl-push">
    <allow own="org.zylos.Push"/>
    <!-- 떠 있지 않은 앱의 푸시는 알림으로, 떠 있는 앱 목록은 WAM 에서 -->
    <allow send_destination="org.zylos.Notification"/>
    <allow send_destination="org.zylos.WebAppManager"
           send_interface="org.zylos.WebAppManager" send_member="ListRunning"/>
  </policy>
  <policy user="zyl-location">
    <allow own="org.zylos.LocationService"/>
    <!-- 사용자의 위치 스위치 (settings_follow) -->
    <allow send_destination="org.zylos.Settings"
           send_interface="org.zylos.Settings" send_member="Get"/>
  </policy>
  <policy user="zyl-network">
    <allow own="org.zylos.Network"/>
  </policy>

  <!-- 그 밖의 누구도 Zyl 서비스 이름을 갖거나 부를 수 없다 -->
  <policy context="default">
    <deny own_prefix="org.zylos"/>
    <deny send_destination_prefix="org.zylos"/>
  </policy>

</busconfig>
