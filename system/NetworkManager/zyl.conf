# ----------------------------------------------------------
# [Clean Architecture] Infrastructure Layer - Network Configuration
#
# 역할: 읽기 전용 루트에서 NetworkManager 가 쓰는 자리
# 수행범위: 저장한 연결(Wi-Fi 비밀번호 포함)은 /data/network, DNS 는
#           /run/NetworkManager/resolv.conf (/etc/resolv.conf 가 그것을 가리킨다 —
#           tools/build-image.sh). 그 밖의 상태(/var/lib/NetworkManager)는 휘발
# 의존방향: network-manager
# SOLID: SRP — 경로만
# ----------------------------------------------------------
[main]
rc-manager=unmanaged

[keyfile]
path=/data/network
