<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ──────────────────────────────────────────────────────────
     [Clean Architecture] Infrastructure Layer - Font Configuration
     역할: 네이티브 레이어(GTK·컴포지터·WAM 크롬)의 기본 글꼴과 언어별 CJK 자형
     수행범위: sans-serif/monospace 별칭, ja/zh/ko 자형 선택, 컬러 이모지 대체
     의존방향: fontconfig, 패키지 fonts-noto-core / fonts-noto-cjk /
               fonts-noto-color-emoji (Arch: noto-fonts / noto-fonts-cjk / noto-fonts-emoji)
     SOLID: SRP — 글꼴 선택만 담당

     웹 앱은 apps/shared/fonts.css 의 스택을 쓰고, 이 파일은 그 밖의 모든 것을
     맡는다. 둘 다 같은 원칙: 한자 통합으로 같은 코드포인트를 쓰는 한·중·일은
     글자 모양이 다르므로 텍스트의 언어가 자형을 고른다.
     ────────────────────────────────────────────────────────── -->
<fontconfig>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Per-language CJK face, ahead of the default KR face -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK JP</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK KR</string></edit>
  </match>

</fontconfig>
