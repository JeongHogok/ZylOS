# ----------------------------------------------------------
# [Clean Architecture] Infrastructure Layer - System User
#
# 역할: 외부 입력을 해석하는 서비스의 전용 비루트 계정
# 수행범위: push(푸시 서버 스트림)·location(Wi-Fi 조회·GeoIP 응답)·network(앱 대신
#           받는 응답) — 하나가 뚫려도 root 도, 다른 서비스의 이름·데이터도 아니게.
#           버스에서 무엇을 갖고 누구를 부를지는 system/dbus-1/zyl-os.conf
# 의존방향: systemd-sysusers
# SOLID: SRP — 서비스 계정 정의만
# ----------------------------------------------------------

g zyl-push - -
u zyl-push - "Zyl OS push service" - /usr/sbin/nologin
g zyl-location - -
u zyl-location - "Zyl OS location service" - /usr/sbin/nologin
# wpa_supplicant's control socket (/run/wpa_supplicant) is the netdev group's
m zyl-location netdev
g zyl-network - -
u zyl-network - "Zyl OS network service" - /usr/sbin/nologin
