# ----------------------------------------------------------
# [Clean Architecture] Infrastructure Layer - Service Drop-in
#
# 역할: bluez 의 페어링 정보를 /data 에 — 루트는 읽기 전용, /var 는 휘발이다
# 수행범위: bluetooth.service 의 /var/lib/bluetooth(StateDirectory) 자리에
#           /data/bluetooth 를 바인드 (그 디렉터리는 tmpfiles 의 zyl-data.conf)
# 의존방향: bluez 의 bluetooth.service
# SOLID: SRP — 상태 위치만
# ----------------------------------------------------------
[Service]
BindPaths=/data/bluetooth:/var/lib/bluetooth
