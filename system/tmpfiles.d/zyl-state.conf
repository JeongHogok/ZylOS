# ----------------------------------------------------------
# [Clean Architecture] Infrastructure Layer - Runtime Paths
#
# 역할: /var 아래 서비스 상태·로그 디렉터리 생성
# 수행범위: 각 유닛의 ReadWritePaths=/var/... 가 가리키는 디렉터리.
#           ProtectSystem=strict 유닛은 이 경로가 없으면 네임스페이스 설정
#           단계에서 기동에 실패한다 — tests/verify-all.sh 가 유닛과 대조한다
# 의존방향: systemd-tmpfiles
# SOLID: SRP — /var provisioning 만 담당 (/data 는 zyl-data.conf, WAM 은 zyl-wam.conf)
#
# 이것이 없어서 logger·credential 이 기동 실패했다 (QEMU 레인이 잡았다):
# verify-all 의 검사가 /data 경로만 보고 있었다.
# ----------------------------------------------------------

d /var/log/zyl-os                0750 root root -
d /var/lib/zyl-os                0750 root root -
d /var/lib/zyl-os/credentials    0700 root root -
