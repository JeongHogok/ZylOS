# ----------------------------------------------------------
# [Clean Architecture] Infrastructure Layer - Data Paths
#
# 역할: /data 아래 서비스 상태 디렉터리 생성
# 수행범위: 각 유닛의 ReadWritePaths=/data/... 가 가리키는 디렉터리.
#           ProtectSystem=strict 유닛은 이 경로가 없으면 네임스페이스 설정
#           단계에서 기동에 실패한다. tests/verify-all.sh 가 유닛과 대조한다
# 의존방향: systemd-tmpfiles, sysusers.d (zyl-wam)
# SOLID: SRP — /data provisioning 만 담당
# ----------------------------------------------------------

d /data/accounts  0700 root    root    -
d /data/alerts    0700 root    root    -
d /data/apps      0750 zyl-wam zyl-wam -
d /data/camera    0700 root    root    -
d /data/lock      0700 root    root    -
d /data/crash     0700 root    root    -
d /data/netstats  0700 root    root    -
d /data/settings  0700 root    root    -
d /data/telemetry 0700 root    root    -
d /data/users     0700 root    root    -
d /data/vpn       0700 root    root    -
